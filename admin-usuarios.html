<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f9f9f9;
    }

    .container {
      max-width: 900px;
    }

    .card {
      margin-bottom: 1rem;
    }

    .header {
      background-color: #0d6efd;
      color: white;
      padding: 1.2rem;
      text-align: center;
      border-radius: 0 0 10px 10px;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Panel de Administración de Usuarios</h1>
  </header>

  <main class="container">
    <h2 class="mb-4">Usuarios registrados</h2>
    <div id="usuariosContainer" class="row">
      <!-- Se cargan usuarios dinámicamente -->
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("usuariosContainer");

      try {
        const response = await fetch("https://dummyjson.com/users");
        const data = await response.json();
        const usuarios = data.users;

        usuarios.forEach(usuario => {
          const card = document.createElement("div");
          card.className = "col-md-6";

          card.innerHTML = `
            <div class="card shadow-sm">
              <div class="card-body">
                <h5 class="card-title">${usuario.firstName} ${usuario.lastName}</h5>
                <p class="card-text">
                  <strong>Email:</strong> ${usuario.email}<br>
                  <strong>Usuario:</strong> ${usuario.username}<br>
                  <strong>Rol:</strong> ${usuario.gender === "male" ? "Admin" : "Usuario"}<br>
                  <strong>Teléfono:</strong> ${usuario.phone}
                </p>
              </div>
            </div>
          `;

          container.appendChild(card);
        });
      } catch (error) {
        container.innerHTML = `<div class="alert alert-danger">Error al cargar usuarios.</div>`;
        console.error("Error al obtener usuarios:", error);
      }
    });
  </script>
</body>
</html>
