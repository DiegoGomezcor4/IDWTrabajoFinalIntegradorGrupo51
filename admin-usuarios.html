<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f9f9f9; }
    .container { max-width: 1000px; }
    .card { margin-bottom: 1rem; }
    .avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-right: 1rem; }
    .user-row { display: flex; align-items: center; }
    .header { background-color: #0d6efd; color: white; padding: 1.2rem; text-align: center; border-radius: 0 0 10px 10px; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <header class="header">
    <h1>Panel de Administración</h1>
    <h4 class="mb-0">Usuarios Registrados</h4>
  </header>

  <main class="container">
    <!-- Alertas -->
    <div id="alertContainer"></div>

    <!-- Filtro y botón agregar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <input type="text" id="searchInput" class="form-control w-50" placeholder="Buscar por nombre o usuario...">
      <button class="btn btn-success ms-2" data-bs-toggle="modal" data-bs-target="#modalAgregar">Agregar Usuario</button>
    </div>

    <div id="usuariosContainer" class="row">
      <!-- Usuarios cargados dinámicamente -->
    </div>
  </main>

  <!-- Modal Agregar -->
  <div class="modal fade" id="modalAgregar" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="formAgregar">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input class="form-control mb-2" name="firstName" placeholder="Nombre" required>
          <input class="form-control mb-2" name="lastName" placeholder="Apellido" required>
          <input class="form-control mb-2" name="username" placeholder="Usuario" required>
          <input class="form-control mb-2" name="email" placeholder="Email" required>
          <input class="form-control mb-2" name="phone" placeholder="Teléfono" required>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Editar -->
  <div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="formEditar">
        <div class="modal-header">
          <h5 class="modal-title">Editar Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id">
          <input class="form-control mb-2" name="firstName" placeholder="Nombre" required>
          <input class="form-control mb-2" name="lastName" placeholder="Apellido" required>
          <input class="form-control mb-2" name="username" placeholder="Usuario" required>
          <input class="form-control mb-2" name="email" placeholder="Email" required>
          <input class="form-control mb-2" name="phone" placeholder="Teléfono" required>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const apiURL = "https://dummyjson.com/users";
    const usuariosContainer = document.getElementById("usuariosContainer");
    const searchInput = document.getElementById("searchInput");
    const alertContainer = document.getElementById("alertContainer");

    let usuarios = [];

    function mostrarAlerta(mensaje, tipo = "success") {
      const alert = document.createElement("div");
      alert.className = `alert alert-${tipo} alert-dismissible fade show`;
      alert.innerHTML = `
        ${mensaje}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      `;
      alertContainer.appendChild(alert);
      setTimeout(() => alert.remove(), 4000);
    }

    function renderUsuarios(lista) {
      usuariosContainer.innerHTML = "";
      lista.forEach(usuario => {
        const card = document.createElement("div");
        card.className = "col-md-6";
        card.innerHTML = `
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="user-row mb-2">
                <img src="${usuario.image || 'https://via.placeholder.com/60'}" class="avatar" alt="avatar">
                <div>
                  <h5 class="card-title mb-0">${usuario.firstName} ${usuario.lastName}</h5>
                  <small class="text-muted">@${usuario.username}</small>
                </div>
              </div>
              <p class="card-text mb-1"><strong>Email:</strong> ${usuario.email}</p>
              <p class="card-text mb-1"><strong>Teléfono:</strong> ${usuario.phone}</p>
              <div class="d-flex justify-content-end">
                <button class="btn btn-sm btn-primary me-2" onclick="abrirEditar(${usuario.id})">Editar</button>
                <button class="btn btn-sm btn-danger" onclick="eliminarUsuario(${usuario.id})">Eliminar</button>
              </div>
            </div>
          </div>
        `;
        usuariosContainer.appendChild(card);
      });
    }

    function filtrarUsuarios() {
      const filtro = searchInput.value.toLowerCase();
      const filtrados = usuarios.filter(u =>
        u.firstName.toLowerCase().includes(filtro) ||
        u.lastName.toLowerCase().includes(filtro) ||
        u.username.toLowerCase().includes(filtro)
      );
      renderUsuarios(filtrados);
    }

    async function cargarUsuarios() {
      try {
        const res = await fetch(apiURL);
        const data = await res.json();
        usuarios = data.users;
        renderUsuarios(usuarios);
      } catch (err) {
        mostrarAlerta("Error al cargar usuarios", "danger");
      }
    }

    // Agregar usuario
    document.getElementById("formAgregar").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const nuevo = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch(apiURL + "/add", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(nuevo)
        });
        const data = await res.json();
        usuarios.unshift(data); // simulado
        renderUsuarios(usuarios);
        bootstrap.Modal.getInstance(form.closest(".modal")).hide();
        mostrarAlerta("Usuario agregado exitosamente");
        form.reset();
      } catch {
        mostrarAlerta("Error al agregar usuario", "danger");
      }
    });

    // Abrir modal editar
    function abrirEditar(id) {
      const usuario = usuarios.find(u => u.id === id);
      const form = document.getElementById("formEditar");
      form.id.value = usuario.id;
      form.firstName.value = usuario.firstName;
      form.lastName.value = usuario.lastName;
      form.username.value = usuario.username;
      form.email.value = usuario.email;
      form.phone.value = usuario.phone;
      new bootstrap.Modal(document.getElementById("modalEditar")).show();
    }

    // Editar usuario
    document.getElementById("formEditar").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const id = form.id.value;
      const actualizado = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch(`${apiURL}/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(actualizado)
        });
        const data = await res.json();
        usuarios = usuarios.map(u => u.id == id ? { ...u, ...data } : u);
        renderUsuarios(usuarios);
        bootstrap.Modal.getInstance(form.closest(".modal")).hide();
        mostrarAlerta("Usuario actualizado");
      } catch {
        mostrarAlerta("Error al actualizar usuario", "danger");
      }
    });

    // Eliminar usuario
    async function eliminarUsuario(id) {
      if (!confirm("¿Eliminar este usuario?")) return;
      try {
        await fetch(`${apiURL}/${id}`, { method: "DELETE" });
        usuarios = usuarios.filter(u => u.id !== id);
        renderUsuarios(usuarios);
        mostrarAlerta("Usuario eliminado");
      } catch {
        mostrarAlerta("Error al eliminar usuario", "danger");
      }
    }

    searchInput.addEventListener("input", filtrarUsuarios);
    document.addEventListener("DOMContentLoaded", cargarUsuarios);
  </script>
</body>
</html>
