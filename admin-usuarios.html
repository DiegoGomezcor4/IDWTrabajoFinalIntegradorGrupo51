<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin - Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary bg-degradado fixed-top ">
            <div class="container-fluid navegador px-5">
    
                <a class="navbar-brand" href="index.html">
                    <img src="imagenes/Logo Colorido de IDW Eventos.png" alt="Logo" width="70" height="auto">
    
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                    aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end " id="navbarNavAltMarkup">
                    <div class="navbar-nav d-flex gap-4">
                        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                        <a class="nav-link" href="institucional.html">Institucional</a>
                        <a class="nav-link" href="eventos.html">Catálogo</a>
    
                        <!-- Dropdown para el saludo del usuario -->
                        <a class="nav-link" href="contacto.html">Contacto</a>
                        <div class="nav-item dropdown" role="group">
                            <button type="button" class="btn btn-outline-secondary dropdown-toggle"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <span id="saludoUsuario" class="navbar-text text-black fw-semibold"></span>
                            </button>
                            <ul class="dropdown-menu bg-light">
                                <li><a class="dropdown-item fs-6 d-none admin-link" href="admin-salones.html">Administrar catálogo</a></li>
                                <li><a class="dropdown-item fs-6 d-none admin-link" href="admin-usuarios.html">Administrar usuarios</a></li>
                            </ul>
                        </div>
    
                        <!-- Botón de login o logout dinámico -->
                        <button id="authBtn" class="btn btn-outline-primary btn-sm">Login</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

  <main class="container">
    <section class="col-12 d-flex justify-content-center align-items-center text-center" style="height:400px;">
            <div class="row align-items-center">
                <div class=" margen-personalizado texto-presentacion">
                    <h2>Panel de Administración</h2>
                    <h4>Usuarios Registrados</h4>
                </div>
            </div>
    </section>


    <!-- Alertas -->
    <div id="alertContainer"></div>

    <!-- Filtro y botón agregar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <input type="text" id="searchInput" class="form-control w-50" placeholder="Buscar por nombre o usuario...">
      <button class="btn btn-success ms-2" data-bs-toggle="modal" data-bs-target="#modalAgregar">Agregar Usuario</button>
    </div>

    <div id="usuariosContainer" class="row">
      <!-- Usuarios cargados dinámicamente -->
    </div>
  </main>

  <!-- Modal Agregar -->
  <div class="modal fade" id="modalAgregar" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="formAgregar">
        <div class="modal-header">
          <h5 class="modal-title">Agregar Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input class="form-control mb-2" name="firstName" placeholder="Nombre" required>
          <input class="form-control mb-2" name="lastName" placeholder="Apellido" required>
          <input class="form-control mb-2" name="username" placeholder="Usuario" required>
          <input class="form-control mb-2" name="email" placeholder="Email" required>
          <input class="form-control mb-2" name="phone" placeholder="Teléfono" required>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Editar -->
  <div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="formEditar">
        <div class="modal-header">
          <h5 class="modal-title">Editar Usuario</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id">
          <input class="form-control mb-2" name="firstName" placeholder="Nombre" required>
          <input class="form-control mb-2" name="lastName" placeholder="Apellido" required>
          <input class="form-control mb-2" name="username" placeholder="Usuario" required>
          <input class="form-control mb-2" name="email" placeholder="Email" required>
          <input class="form-control mb-2" name="phone" placeholder="Teléfono" required>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/admin-usuarios.js"></script>
  <script src="js/navbar-auth.js" defer></script>
  <script defer src="js/proteger.js"></script>
</body>
</html>
