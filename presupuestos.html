<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestos</title>
     <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link href="estilos.css" rel="stylesheet" />
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary bg-degradado fixed-top ">
  <div class="container-fluid navegador px-5">

    <a class="navbar-brand" href="index.html">
      <img src="imagenes/Logo Colorido de IDW Eventos.png" alt="Logo" width="70" height="auto">

    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end " id="navbarNavAltMarkup">
      <div class="navbar-nav d-flex gap-4">
        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
        <a class="nav-link" href="institucional.html">Institucional</a>
        <a class="nav-link" href="eventos.html">Catálogo</a>
        
<!-- Dropdown para el saludo del usuario -->   
        <a class="nav-link" href="contacto.html">Contacto</a>
        <div class="nav-item dropdown" role="group">
            <button type="button" class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                <span id="saludoUsuario" class="navbar-text text-black fw-semibold"></span>
            </button>
            <ul class="dropdown-menu bg-light">
                <li><a class="dropdown-item fs-6" href="admin-salones.html">Administrar catálogo</a></li>
            </ul>
        </div>
  
<!-- Botón de login o logout dinámico -->
        <button id="authBtn" class="btn btn-outline-primary btn-sm">Login</button>
      </div>
    </div>
  </div>
        </nav>
    </header>
    <main class="container g-md-2 g-lg-2">
        <div class="row my-3 d-flex gy-5 text-center">
            <div class="col texto-presentacion">
                <h2 class="text-center">Presupuestos</h2>
                <p class="text-center">Aquí puede solicitar cotizaciones por salon y tipo de evento.</p>
            </div>
        </div>
        <div>
            <form class=" col-md-12" id="formPresupuestos">
                <div class="row mt-2">    
                    <div class="mt-2">
                        <label for="nombrePresupuesto" class="form-label">Nombre y Apellido</label>
                        <input class="form-control" type="text" id="nombrePresupuesto" required>
                    </div>
                    <div class="mt-2">
                        <label for="fecha" class="form-label">Seleccionar fecha</label>
                        <input type="date" class="form-control" id="fecha">
                    </div>
                    <div class="mt-2">
                        <label for="salones" class="form-label">Seleccionar salón: </label>
                        <select name="salones" id="salones" class="form-control">
                            <option value="" selected>Elegir</option>

                        </select>
                    </div>
                    <div class="mt-2">
                        <label for="evento" class="form-label">Tipo de evento: </label>
                        <input type="text" class="form-control" id="evento" required>
                    </div>
                    <div class="mt-2">
                        <h6>Seleccionar servicios requeridos</h6>
                        <div class="mt-2">
                            <input type="checkbox" id="cat" value="Catering">
                            <label for="cat" class="form-label">Catering</label>
                        </div>
                        <div class="mt-2">
                            <input type="checkbox" id="fiestaTem" value="Fiesta temática">
                            <label for="fiestaTem" class="form-label">Fiesta temática</label>
                        </div>
                        <div class="mt-2">
                            <input type="checkbox" id="musicaEntreteimiento" value="Música y entretenimiento">
                            <label for="musicaEntreteimiento" class="form-label">Música y entretemiento</label>
                        </div>
                        <div class="mt-2">
                            <input type="checkbox" id="fotoVideo" value="Fotografía y vídeo">
                            <label for="fotoVideo" class="form-label">Fotografía y vídeo</label>
                        </div>
                    </div>
                    <div class="d-grid gap-5 mt-2">
                        <button class="btn btn-primary mt-2" type="submit">Enviar</button>
                    </div>
                </div>    
            </form>
        </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="js/navbar-auth.js" defer></script>
    <script src="js/presupuetos.js" defer></script>
</body>
</html>
