<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Salones</title>
        <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <script defer src="./js/altaSalon.js"></script>
</head>
<body>
    <header>
        <div class="container-fluid">
        </div>
    </header>
    <main class="container">
        <h1>Registro de salones</h1>
        <form class="mt-2" id="formSalones">
            <div class="mt-2">
                <label for="" class="form-label">Nombre</label>
                <input class="form-control" type="text" id="nombre" required>
            </div>
            <div class="mt-2">
                <label for="" class="form-label">Dirección</label>
                <input class="form-control" type="text" id="dir" required>
            </div>
            <div class="mt-2">
                <label for="" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" rows="4" required></textarea>
                </div>
            <div class="d-grid gap-2 mt-2">
                <button class="btn btn-primary" type="submit">Guardar</button>
            </div>
            <div class="d-grid gap-2 mt-2">
            <button type="button" class="btn btn-danger" id="salir">Salir</button>
            </div>
    
    </form>
    </main>
    <h3 class="container text-center mt-4">Lista de salones</h3>
    <table class="container text-center table-bordered border-primary mt-2" id="tabla">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>Descripción</th>
            </tr>
        </thead>    
        <tbody>

        </tbody>
    </table>
</body>
</html>
