</head>
<body>
    <!-- barra de navegación-->
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary bg-degradado fixed-top ">
  <div class="container-fluid navegador px-5">

    <a class="navbar-brand" href="index.html">
      <img src="imagenes/Logo Colorido de IDW Eventos.png" alt="Logo" width="70" height="auto">

    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end " id="navbarNavAltMarkup">
      <div class="navbar-nav d-flex gap-4">

      </div>

    </header>
        <h1>Registro de salones</h1>
        <form class="mt-2" id="formSalones">
            <div class="mt-2">
                <label for="" class="form-label">Nombre</label>
                <input class="form-control" type="text" id="nombre" required>
            </div>
            <div class="mt-2">
                <label for="" class="form-label">Dirección</label>
                <input class="form-control" type="text" id="dir" required>
            </div>
            <div class="mt-2">
                <label for="" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" rows="4" required></textarea>
                </div>
            <div class="d-grid gap-2 mt-2">
                <button class="btn btn-primary" type="submit">Guardar</button>
            </div>
    </form>
    </main>
    <h3 class="container text-center mt-4">Lista de salones</h3>
    <table class="container text-center table-bordered border-primary mt-2" id="tabla">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>Descripción</th>
                <th>Opciones</th>
            </tr>
        </thead>    
        <tbody>
        </tbody>
    </table>
    <script defer src="js/proteger-admin.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/altaSalon.js"></script>
    <script defer src="js/accionSalon.js"></script>
</body>
</html>
